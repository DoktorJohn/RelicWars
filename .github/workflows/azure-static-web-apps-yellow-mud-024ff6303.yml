name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Generate deployment provenance
        shell: bash
        run: |
          data_sha="$(sha256sum 0.0.1Build/Build/0.0.1Build.data.br | cut -d ' ' -f 1)"
          framework_sha="$(sha256sum 0.0.1Build/Build/0.0.1Build.framework.js.br | cut -d ' ' -f 1)"
          loader_sha="$(sha256sum 0.0.1Build/Build/0.0.1Build.loader.js | cut -d ' ' -f 1)"
          wasm_sha="$(sha256sum 0.0.1Build/Build/0.0.1Build.wasm.br | cut -d ' ' -f 1)"
          jq -n \
            --arg commitSha "$GITHUB_SHA" \
            --arg deployedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg dataSha "$data_sha" \
            --arg frameworkSha "$framework_sha" \
            --arg loaderSha "$loader_sha" \
            --arg wasmSha "$wasm_sha" \
            '{
              commitSha: $commitSha,
              deployedAtUtc: $deployedAtUtc,
              webglBinaries: {
                "Build/0.0.1Build.data.br": $dataSha,
                "Build/0.0.1Build.framework.js.br": $frameworkSha,
                "Build/0.0.1Build.loader.js": $loaderSha,
                "Build/0.0.1Build.wasm.br": $wasmSha
              }
            }' > 0.0.1Build/deployment-info.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MUD_024FF6303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "./0.0.1Build"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MUD_024FF6303 }}
          action: "close"
